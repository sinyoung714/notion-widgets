<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>today</title>
<link rel='preconnect' href='https://fonts.googleapis.com'><link rel='preconnect' href='https://fonts.gstatic.com' crossorigin><link href='https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@500&family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=Instrument+Serif:ital@0;1&display=swap' rel='stylesheet'>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:"DM Sans","Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.wrap{height:100%;display:grid;grid-template-columns:1.15fr 1fr;gap:12px;padding:12px}
.panel{border-radius:24px;padding:clamp(14px,3vh,28px) clamp(16px,2.6vw,30px);display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,2.2vh,20px);position:relative;overflow:hidden;min-height:0}
.mono{font-family:"DM Mono","Courier New",monospace;font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.serif{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400}
.disp{font-family:"Bricolage Grotesque","Arial Black",sans-serif;font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
button{font-family:"Bricolage Grotesque","Arial Black",sans-serif;font-weight:800;font-size:13px;cursor:pointer;border-radius:999px;white-space:nowrap;transition:transform .1s}
button:active{transform:scale(.96)}
.focus{align-items:center;text-align:center}
.ring{position:relative;width:clamp(120px,min(22vw,48vh),250px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.time{font-family:"Bricolage Grotesque","Arial Black",sans-serif;font-weight:800;font-size:clamp(26px,min(4.6vw,10.5vh),56px);letter-spacing:-.03em;line-height:1}
.modes{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.modes button{font-size:12px;padding:6px 11px}
.ctrl{display:flex;gap:8px;width:100%;max-width:290px}
#go{flex:1;font-size:16px;padding:10px 18px}
.dots{display:flex;gap:6px;align-items:center;justify-content:center}
.dots span{width:12px;height:12px;border-radius:50%}
.switch{display:none}
@media (max-height:380px){.focus .ttl{display:none}.panel{gap:8px}.dots{display:none}}
@media (max-width:640px){
  .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:8px;padding:10px}
  .switch{display:flex;gap:6px;justify-content:center}
  .switch button{font-size:12px;padding:6px 14px}
  body:not([data-view="focus"]) .focus{display:none}
  body[data-view="focus"] .hello{display:none}
  .ring{width:clamp(120px,min(46vw,42vh),220px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--page:#FFF4E6;--soft:#FFFBF4;--ink:#2B1B3A;--a1:#FF6B3D;--a2:#C9E54B;--a3:#8EC8FF;--a4:#3DBA93;--a5:#FF9DC8;--a6:#D9C2FF;--lbl:#7A3E8E}
:root[data-theme="berry"]{--page:#FCF1F4;--soft:#FFF8FA;--ink:#3A1D2B;--a1:#F2577A;--a2:#FFE07A;--a3:#B9D6FF;--a4:#9CC48A;--a5:#FFB8CF;--a6:#DCCBF6;--lbl:#B23A5C}
.panel{border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.hello{background:var(--soft);background-image:linear-gradient(color-mix(in srgb,var(--ink) 6%,transparent) 1.5px,transparent 1.5px),linear-gradient(90deg,color-mix(in srgb,var(--ink) 6%,transparent) 1.5px,transparent 1.5px);background-size:26px 26px}
.focus{background:var(--a3);background-image:radial-gradient(rgba(255,255,255,.5) 2px,transparent 2.5px);background-size:22px 22px}
body[data-mode="1"] .focus,body[data-mode="2"] .focus{background-color:var(--a2)}
.chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px 4px 10px;box-shadow:3px 3px 0 var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a1)}
.date{opacity:.7}
.hi{font-size:clamp(20px,min(3.3vw,5vh),34px);line-height:1.1}
.hi b{font-family:"Bricolage Grotesque","Arial Black",sans-serif;font-style:normal;font-weight:800;letter-spacing:-.02em}
.clock{display:flex;align-items:baseline;gap:8px;line-height:.9}
.clock .t{font-size:clamp(46px,min(8vw,19vh),116px);letter-spacing:-.045em}
.ap{font-size:15px;background:var(--a2);border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px;transform:translateY(-8px) rotate(-4deg);letter-spacing:0}
.bars{display:grid;gap:clamp(5px,1.2vh,11px)}
.bar{display:grid;grid-template-columns:48px 1fr 40px;align-items:center;gap:10px}
.track{height:clamp(11px,2vh,17px);border:2.5px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.fill{height:100%;border-radius:999px;transition:width .6s}
.pct{text-align:right}
.vibe{display:flex;align-items:center;gap:10px;background:var(--a6);border:2.5px solid var(--ink);border-radius:16px;padding:9px 9px 9px 14px;box-shadow:3px 3px 0 var(--ink)}
.vibe p{flex:1;font-size:clamp(13px,1.9vh,16px);line-height:1.3;font-weight:500}
button{color:var(--ink);background:var(--a5);border:2.5px solid var(--ink);padding:7px 12px;box-shadow:2px 2px 0 var(--ink)}
button:active{box-shadow:none}
.ttl{font-size:clamp(20px,3.3vh,28px);letter-spacing:-.02em;line-height:1}
.ttl i{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.lbl2{font-size:11px}
.modes button{background:#fff}
.modes button.on{background:var(--ink);color:#fff}
#go{background:var(--a1);color:#fff}
#rs{background:#fff}
.dots span{border:2.5px solid var(--ink);background:#fff}
.dots span.f{background:var(--a1)}
.switch button{background:#fff}.switch button.on{background:var(--ink);color:#fff}
@media (max-height:290px){.bars{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="switch"><button type="button" class="on" data-v="hello">today</button><button type="button" data-v="focus">focus</button></div>
  <section class="panel hello">
    <div class="top"><span class="chip mono"><span class="dot"></span><span id="part">today</span></span><span class="date mono" id="date"></span></div>
    <div class="hi serif" id="hi">hey, <b>main character</b></div>
    <div class="clock disp"><span class="t" id="t">--:--</span><span class="ap mono" id="ap"></span></div>
    <div class="bars">
      <div class="bar mono"><span>day</span><div class="track"><div class="fill" id="fd" style="background:var(--a1);width:0"></div></div><span class="pct" id="pd">0%</span></div>
      <div class="bar mono"><span>week</span><div class="track"><div class="fill" id="fw" style="background:var(--a3);width:0"></div></div><span class="pct" id="pw">0%</span></div>
      <div class="bar mono"><span>year</span><div class="track"><div class="fill" id="fy" style="background:var(--a4);width:0"></div></div><span class="pct" id="py">0%</span></div>
    </div>
    <div class="vibe"><p id="aff"></p><button id="shuffle" type="button">another</button></div>
  </section>
  <section class="panel focus">
    <div class="ttl disp">focus <i>mode</i></div>
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="#fff" stroke="currentColor" stroke-width="5"/><circle id="arc" cx="60" cy="60" r="44" fill="none" stroke="var(--a1)" stroke-width="12" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
      <div class="in"><div class="time" id="time">25:00</div><div class="lbl2 mono" id="lbl">deep work</div></div>
    </div>
    <div class="modes"><button type="button" class="on" data-m="25" data-l="deep work" data-i="0">focus 25</button><button type="button" data-m="5" data-l="stretch, sip water" data-i="1">break 5</button><button type="button" data-m="15" data-l="go touch grass" data-i="2">rest 15</button></div>
    <div class="ctrl"><button type="button" id="go">start</button><button type="button" id="rs" aria-label="reset">↺</button></div>
    <div class="dots mono" id="dots"><span></span><span></span><span></span><span></span>&nbsp;<em id="cnt" style="font-style:normal">today</em></div>
  </section>
</div>
<script>
(function(){
  var THEMES=["berry"];
  var th=(new URLSearchParams(location.search).get("theme")||"").toLowerCase();if(THEMES.indexOf(th)>-1)document.documentElement.setAttribute("data-theme",th);

  function $(i){return document.getElementById(i)}
  var AFF=["one glass of water, then the next thing.","you're allowed to do the easy task first.","small and done beats big and someday.","rest counts. it's on the list too.","text the friend back. it takes 30 seconds.","make the bed, win the first round.","phone in another room for 25 minutes?","you've handled harder weeks than this one.","tidy one surface. just one.","future you is going to love this.","good enough is a real finish line.","step outside for five minutes. sky check."];
  var D=["sun","mon","tue","wed","thu","fri","sat"],M=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  function set(f,p,v){var n=Math.max(0,Math.min(100,Math.round(v*100)));$(f).style.width=n+"%";$(p).textContent=n+"%"}
  function tick(){
    var d=new Date(),h=d.getHours(),m=d.getMinutes();
    $("t").textContent=(h%12||12)+":"+(m<10?"0":"")+m;$("ap").textContent=h<12?"am":"pm";
    $("date").textContent=D[d.getDay()]+" · "+M[d.getMonth()]+" "+d.getDate();
    $("part").textContent=h<5?"night owl":h<12?"morning":h<17?"afternoon":h<21?"evening":"night";
    $("hi").innerHTML=(h<5?"still up,":h<12?"good morning,":h<17?"good afternoon,":h<21?"good evening,":"wind down,")+" <b>main character</b>";
    var day=(h*3600+m*60+d.getSeconds())/86400;set("fd","pd",day);
    set("fw","pw",(((d.getDay()+6)%7)+day)/7);
    var y0=new Date(d.getFullYear(),0,1),y1=new Date(d.getFullYear()+1,0,1);set("fy","py",(d-y0)/(y1-y0));
  }
  var i=Math.floor(Math.random()*AFF.length);$("aff").textContent=AFF[i];
  $("shuffle").addEventListener("click",function(){i=(i+1+Math.floor(Math.random()*(AFF.length-1)))%AFF.length;$("aff").textContent=AFF[i]});
  tick();setInterval(tick,15000);
  var MODES=[[25,"deep work"]],STORE="mco_focus",COUNT_ALL=false;

  var C=276.46,bs=document.querySelectorAll(".modes button"),cur=0,total=MODES[0][0]*60,left=total,run=false,timer=null,label=MODES[0][1],done=0,endAt=0,KEY=STORE;
  function today(){return new Date().toDateString()}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({d:today(),n:done,i:cur,run:run,endAt:endAt,left:left}))}catch(e){}}
  function dots(){var sp=$("dots").querySelectorAll("span");for(var k=0;k<sp.length;k++)sp[k].className=k<Math.min(done,4)?"f":"";$("cnt").textContent=done>4?"+"+(done-4)+" today":"today"}
  function draw(){var mm=Math.floor(left/60),ss=left%60;$("time").textContent=(mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss;$("arc").style.strokeDashoffset=(C*(1-left/total)).toFixed(2);$("go").textContent=run?"pause":(left<total&&left>0?"resume":"start");$("lbl").textContent=left===0?"done ✦":label}
  function stop(){run=false;clearInterval(timer);timer=null}
  function finish(){var e=endAt;stop();left=0;if((COUNT_ALL||cur===0)&&new Date(e).toDateString()===today())done++;save();dots();draw()}
  function step(){left=Math.max(0,Math.ceil((endAt-Date.now())/1000));if(left===0)finish();else draw()}
  function tickOn(){clearInterval(timer);timer=setInterval(step,250)}
  function pick(i){cur=i;for(var j=0;j<bs.length;j++)bs[j].className=j===i?"on":"";total=+bs[i].getAttribute("data-m")*60;label=bs[i].getAttribute("data-l");document.body.setAttribute("data-mode",String(i))}
  $("go").addEventListener("click",function(){if(left===0)left=total;if(run){left=Math.max(1,Math.ceil((endAt-Date.now())/1000));stop()}else{run=true;endAt=Date.now()+left*1000;tickOn()}save();draw()});
  $("rs").addEventListener("click",function(){stop();left=total;save();draw()});
  for(var k=0;k<bs.length;k++)bs[k].addEventListener("click",function(){stop();pick(+this.getAttribute("data-i"));left=total;save();draw()});
  var sw=document.querySelectorAll(".switch button");
  for(var k2=0;k2<sw.length;k2++)sw[k2].addEventListener("click",function(){for(var j=0;j<sw.length;j++)sw[j].className="";this.className="on";document.body.setAttribute("data-view",this.getAttribute("data-v"))});
  try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");
    if(s.d===today())done=s.n||0;
    if(typeof s.i==="number"&&bs[s.i]){pick(s.i);left=total;
      if(s.run&&s.endAt){endAt=s.endAt;run=true;left=Math.max(0,Math.ceil((endAt-Date.now())/1000));if(left===0)finish();else tickOn()}
      else if(typeof s.left==="number"&&s.left>0&&s.left<=total)left=s.left}
  }catch(e){}
  document.addEventListener("visibilitychange",function(){if(run&&!document.hidden)step()});
  dots();draw();

})();</script>
</body>
</html>
